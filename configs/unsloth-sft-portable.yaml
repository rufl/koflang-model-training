data:
  format_type: conversational

training:
  training_type: lora
  max_seq_length: 256
  load_in_4bit: true
  trust_remote_code: false
  num_epochs: 1
  learning_rate: 0.00002
  batch_size: 1
  gradient_accumulation_steps: 1
  warmup_steps: 8
  max_steps: 0
  save_steps: 0
  weight_decay: 0.001
  random_seed: 1
  packing: false
  train_on_completions: true
  gradient_checkpointing: true

lora:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  use_rslora: false
  use_loftq: false
  use_dora: false

logging:
  enable_wandb: false
  enable_tensorboard: false
